apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def isExpo = findProject(':expo-modules-core') != null

if (isExpo) {
  group = 'com.emarsys.reactnative.expo'
  version = '2.0.0-beta.2'

  def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
  apply from: expoModulesCorePlugin
  applyKotlinExpoModulesCorePlugin()
  useCoreDependencies()
  useExpoPublishing()
}

buildscript {
  // Simple helper that allows the root project to override versions declared by this library.
  ext.safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }
}
project.android {
  compileSdkVersion safeExtGet("compileSdkVersion", 36)
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 36)
  }
}

android {
  namespace "com.emarsys.reactnative"
  defaultConfig {
    versionCode 3
    versionName "2.0.0-beta.2"
  }
  kotlinOptions {
    jvmTarget = '17'
    freeCompilerArgs += ["-Xskip-metadata-version-check"]
  }
  lintOptions {
    abortOnError false
  }
  if (!isExpo) {
    sourceSets {
      main {
        java {
          exclude 'com/emarsys/reactnative/expo/**'
        }
        kotlin {
          exclude 'com/emarsys/reactnative/expo/**'
        }
      }
    }
  }
}

if (!isExpo) {
  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    exclude 'com/emarsys/reactnative/expo/**'
  }
}

tasks.withType(Test) {
  testLogging {
    events "passed", "skipped", "failed"
    exceptionFormat "full"
    showStandardStreams = true
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.16.0"
  implementation "com.facebook.react:react-native:+"
  api "com.emarsys:emarsys-sdk:3.11.+"
  api "com.emarsys:emarsys-firebase:3.11.+"
  
  // Test dependencies
  testImplementation "junit:junit:4.13.2"
  testImplementation "io.mockk:mockk:1.13.8"
  testImplementation "org.jetbrains.kotlin:kotlin-test-junit:1.9.20"
}
