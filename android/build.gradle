apply plugin: "com.android.library"
apply plugin: "com.facebook.react"

def isExpo = findProject(':expo-modules-core') != null

if (!isExpo) {
  try {
    apply plugin: "org.jetbrains.kotlin.android"
  } catch (Exception ignored) {
    // AGP 9.0+ has built-in Kotlin support; kotlin.android plugin is not needed
  }
}

if (isExpo) {
  group = 'com.emarsys.reactnative.expo'
  version = '2.0.0-beta.2'

  def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
  apply from: expoModulesCorePlugin
  applyKotlinExpoModulesCorePlugin()
  useCoreDependencies()
  useExpoPublishing()
}

android {
  namespace "com.emarsys.reactnative"
  compileSdk 36
  defaultConfig {
    minSdk 24
    targetSdk 36
    versionCode 3
    versionName "2.0.0-beta.2"
  }
  lintOptions {
    abortOnError false
  }
  if (!isExpo) {
    sourceSets {
      main {
        java {
          exclude 'com/emarsys/reactnative/expo/**'
        }
        kotlin {
          exclude 'com/emarsys/reactnative/expo/**'
        }
      }
    }
  }
}

if (!isExpo) {
  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    exclude 'com/emarsys/reactnative/expo/**'
  }
}

tasks.withType(Test) {
  testLogging {
    events "passed", "skipped", "failed"
    exceptionFormat "full"
    showStandardStreams = true
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.16.0"
  implementation "com.facebook.react:react-native:+"
  api "com.emarsys:emarsys-sdk:3.11.+"
  api "com.emarsys:emarsys-firebase:3.11.+"
  
  // Test dependencies
  testImplementation "junit:junit:4.13.2"
  testImplementation "io.mockk:mockk:1.13.8"
  testImplementation "org.jetbrains.kotlin:kotlin-test-junit:1.9.20"
}
