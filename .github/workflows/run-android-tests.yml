name: Run Android Tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  android-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '18'

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies
      run: npm ci

    - name: Build SDK
      run: npm run clean && npm run build

    - name: Install example dependencies
      working-directory: example/expo
      run: npm install

    - name: Create google-services.json
      run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > example/expo/assets/google-services.json

    - name: Prebuild Android project
      working-directory: example/expo
      run: npm run prebuild:android

    - name: Run Android Tests
      working-directory: example/expo/android
      run: ./gradlew :emartech_react-native-emarsys-sdk:test
