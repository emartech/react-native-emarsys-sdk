name: Run iOS Tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  ios-tests:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Build SDK
      run: npm run clean && npm run build

    - name: Install example dependencies
      working-directory: example/expo
      run: npm install

    - name: Prebuild iOS project
      working-directory: example/expo
      run: npm run prebuild:ios

    - name: Build app for testing
      working-directory: example/expo/ios
      run: |
        xcodebuild build-for-testing \
          -workspace reactnativeemarsyssdkexample.xcworkspace \
          -scheme reactnativeemarsyssdkexample \
          -destination 'platform=iOS Simulator,name=iPhone 17' \
          -quiet

    - name: Run iOS Tests
      working-directory: example/expo/ios
      run: |
        xcodebuild test \
          -workspace reactnativeemarsyssdkexample.xcworkspace \
          -scheme RNEmarsysSDKTest \
          -destination 'platform=iOS Simulator,name=iPhone 17'
