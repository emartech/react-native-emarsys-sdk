name: Release

on: push
  # release:
  #   types: [published]

jobs:
  run-integration-tests:
    name: Run Integration Tests
    uses: ./.github/workflows/run-integration-tests.yml
    secrets: inherit

  run-android-tests:
    name: Run Android Tests
    uses: ./.github/workflows/run-android-tests.yml
    secrets: inherit

  run-ios-tests:
    name: Run iOS Tests
    uses: ./.github/workflows/run-ios-tests.yml
    secrets: inherit

  build-package:
    name: Build Package
    needs: [run-integration-tests, run-android-tests, run-ios-tests]
    uses: ./.github/workflows/build-package.yml
    secrets: inherit

  build-sample-expo:
    name: Build Expo Sample
    needs: build-package
    uses: ./.github/workflows/build-sample-expo.yml
    secrets: inherit

  build-sample-rn:
    name: Build React Native Sample
    needs: build-package
    uses: ./.github/workflows/build-sample-rn.yml
    secrets: inherit

  publish-npm:
    name: Publish to npm
    needs: [build-sample-expo, build-sample-rn]
    uses: ./.github/workflows/publish-npm.yml
    secrets: inherit
