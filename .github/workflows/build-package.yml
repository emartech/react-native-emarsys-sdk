name: Build Package

on:
  workflow_call:

jobs:
  build-package:
    name: Build, Test & Pack
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci

    - name: Check version consistency
      run: bash scripts/check-version-consistency.sh

    - name: Verify version matches release tag
      if: github.event_name == 'release'
      run: |
        PKG=$(node -pe "require('./package.json').version")
        TAG="${{ github.event.release.tag_name }}"
        if [ "$PKG" != "${TAG#v}" ]; then
          echo "::error::package.json version ($PKG) != release tag (${TAG#v})"
          exit 1
        fi
        echo "Version $PKG matches release tag $TAG"

    - name: Run linting
      run: npm run lint:all

    - name: Run tests
      run: npm run test

    - name: Build project
      run: npm run clean && npm run build

    - name: Pack tarball
      run: |
        mkdir -p artifacts
        rm -f artifacts/*.tgz || true
        npm pack --pack-destination ./artifacts

    - name: Dry run publish
      run: npm publish --dry-run ./artifacts/*.tgz
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISHER_TOKEN }}

    - name: Upload package artifact
      uses: actions/upload-artifact@v7
      with:
        name: npm-package
        path: artifacts/*.tgz
        if-no-files-found: error
        retention-days: 7
