name: On Pull Request
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  run-tests:
    name: Run Tests
    uses: ./.github/workflows/run-tests.yml
    secrets: inherit

  build-package:
    name: Build Package
    needs: run-tests
    uses: ./.github/workflows/build-package.yml
    secrets: inherit

  build-sample-expo:
    name: Build Expo Sample
    needs: build-package
    uses: ./.github/workflows/build-sample-expo.yml
    secrets: inherit

  build-sample-rn:
    name: Build React Native Sample
    needs: build-package
    uses: ./.github/workflows/build-sample-rn.yml
    secrets: inherit
